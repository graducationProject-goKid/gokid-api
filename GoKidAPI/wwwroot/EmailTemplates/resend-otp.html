<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Your verification code</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>

    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center" style="padding:28px 12px;">
                <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(18,38,63,0.08);">
                    <tr>
                        <td style="padding:28px 36px;">
                            <h1 style="font-size:20px;margin:0 0 6px 0;color:#111;">Your verification code</h1>
                            <p style="margin:0 0 18px 0;color:#555;font-size:14px;">
                                Hi {{UserName}},<br />

                            </p>

                            <div style="margin:22px 0 6px 0;">
                                <div style="display:inline-block;padding:18px 22px;border-radius:10px;background:#f7fbff;border:1px solid #e6f0ff;font-size:28px;letter-spacing:6px;font-weight:800;color:#0b3d91;">
                                    {{Otp}}
                                </div>
                            </div>

                            <p style="margin:8px 0 0 0;color:#777;font-size:13px;">

                            </p>

                            <hr style="border:none;border-top:1px solid #eee;margin:22px 0;" />

                            <p style="margin:0;color:#666;font-size:13px;">
                                If you didn't request this, simply ignore this email
                            </p>

                            <p style="margin:14px 0 0 0;color:#999;font-size:12px;">GO-KID Team</p>
                        </td>
                    </tr>
                </table>
